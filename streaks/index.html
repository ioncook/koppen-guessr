<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KöppenGuessr | Streaks</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <!-- Scripts: PapaParse (CSV) and netcdfjs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/netcdfjs@0.10.0/dist/netcdfjs.min.js"></script>
    <link rel="stylesheet" href="streaks.css">
    <style>
        .home-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .zone-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-top: 8px;
        }

        .zone-col-label {
            font-size: 0.45rem;
            font-weight: 900;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            padding-bottom: 3px;
        }

        .zone-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 900;
            border: none;
            border-radius: 6px;
            padding: 14px 2px;
            cursor: pointer;
            transition: transform 0.05s, box-shadow 0.05s;
            color: #000;
            width: 100%;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .zone-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 2;
            position: relative;
        }

        .zone-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <div id="game-container">
        <header>
            <div class="header-left">
                <a href="../index.html" class="home-link">← Home</a>
                <h1 style="font-weight: 800; letter-spacing: -1px;">Streaks</h1>
            </div>
            <div class="header-stats">
                <div>STREAK <span id="streak-value">0</span></div>
            </div>
        </header>

        <main>
            <div id="city-card" class="card">
                <div id="city-info">
                    <h2 id="city-name">Loading...</h2>
                    <h3 id="country-info">
                        <span id="flag-emoji"></span>
                        <span id="admin-country"></span>
                    </h3>
                </div>
                    <div id="game-area">
                        <p style="color:var(--text-secondary); font-size:0.8rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom: 2px;">Identify the Climate</p>
                        <div id="guess-input-container">
                            <div class="zone-grid" id="zone-grid"></div>
                        </div>
                        <div id="tooltip" class="tooltip"></div>
                    </div>
            </div>
        </main>

        <div id="feedback-overlay" class="hidden">
            <div id="modal">
                <h2 id="feedback-message" style="font-size: 1.8rem; margin-bottom: 20px;"></h2>
                <div id="feedback-details" style="margin-bottom: 30px;"></div>
                <button id="next-btn" class="modal-btn" style="width:100%; background:#222; border:1px solid #333; color:#fff; padding:15px; border-radius:30px; font-weight:700; cursor:pointer;">Next City</button>
            </div>
        </div>


    </div>

    <script src="streaks.js"></script>
</body>

</html>
