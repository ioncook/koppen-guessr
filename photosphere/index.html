<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Guessr - Photo Sphere</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../streaks/streaks.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #ababab;
            --card-bg: #141414;
            --border-color: #1f1f1f;
            --text-secondary: #777;
            --text-color: #e0e0e0;
        }

        #image-container {
            width: 100%;
            height: 380px;
            background-color: #000;
            border-radius: 8px;
            margin-bottom: 8px;
            position: relative;
            border: 1px solid #222;
            overflow: hidden;
        }

        #streetview-pano {
            width: 100%;
            height: 100%;
        }

        #load-curtain {
            position: absolute;
            inset: 0;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #111;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .home-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #feedback-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #feedback-overlay.hidden {
            display: none;
        }

        #dropdown {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #modal {
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            padding: 40px 40px 10px 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
        }

        .unit-toggle-small {
            display: flex;
            gap: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            margin-top: 10px;
            justify-content: center;
        }

        .unit-toggle-small .active {
            color: var(--accent-color);
        }

        #stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        #guess-input-container {
            position: relative;
        }

        .zone-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-top: 8px;
        }

        .zone-col-label {
            font-size: 0.45rem;
            font-weight: 900;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            padding-bottom: 3px;
        }

        .zone-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 900;
            border: none;
            border-radius: 6px;
            padding: 11px 1px;
            cursor: pointer;
            transition: transform 0.05s, box-shadow 0.05s;
            color: #000;
            width: 100%;
        }

        .zone-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 2;
            position: relative;
        }

        .zone-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <div id="game-container">
        <header>
            <div style="display:flex; align-items:center;">
                <a href="../index.html" class="home-link">← Home</a>
                <h1 style="margin-left: 20px; font-weight: 800; letter-spacing: -1px;">Photo Sphere</h1>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="stat-box">
                    <span class="stat-label" style="letter-spacing: 2px;">ROUND</span>
                    <span id="round-indicator-val">1/5</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label" style="letter-spacing: 2px;">DISTANCE</span>
                    <span id="session-score">0 KM</span>
                </div>
            </div>
        </header>

        <main>
            <div class="card">
                <div id="image-container">
                    <div id="streetview-pano"></div>
                    <div id="load-curtain">
                        <div class="spinner"></div>
                        <p style="color:var(--text-secondary); font-size: 0.8rem;">Loading Street View...</p>
                    </div>
                </div>

                <div id="guess-input-container">
                    <div class="zone-grid" id="zone-grid"></div>
                </div>
                <div id="tooltip" class="tooltip"></div>
            </div>
        </main>

        <div id="feedback-overlay" class="hidden">
            <div id="modal">
                <h2 id="modal-title" style="font-size: 1.8rem; margin-bottom: 20px;"></h2>
                <div id="modal-details" style="margin-bottom: 30px;"></div>
                <button id="modal-btn" class="modal-btn"
                    style="width:100%; background:#222; border:1px solid #333; color:#fff; padding:15px; border-radius:30px; font-weight:700; cursor:pointer;">Continue</button>
            </div>
        </div>
    </div>

    <script src="photosphere.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAEmxm4qy5SK05sh4XLcrXeLYkYbAr8ZGM&callback=initStreetView"></script>
</body>

</html>
